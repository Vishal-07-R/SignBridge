services:
  - type: web
    name: signbridge-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signbridge-postgres
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["https://frontend-bay-one-50.vercel.app"]'

databases:
  - name: signbridge-postgres
    plan: free
    region: oregon
    databaseName: signbridge
    user: signbridge_user
